name: my-first-workflow
run-name: Deployed by @${{ github.actor }}
on: push
jobs:
  job1: 
    name: Job1
    runs-on: ubuntu-latest
    steps:
      - name: Running single command in Job1
        run: echo "Hi this is my first workflow job"
      - name: Check the OS for GitHub Hosted runners
        run: cat /etc/os-release
      - name: Calling sleep
        run: sleep 10
  job2:
    name: Job2
    runs-on: ubuntu-latest
    steps:
      - name: Checking the host name for the runner
        run: hostname
      - name: Running multiple commands
        run: |
          echo "Hi from Sneha"
          echo "Current time is `date`"
  job3:
    needs: job1
    name: Job3
    runs-on: ubuntu-latest
    steps:
      - name: Job with single dependency
        run: sleep 10
  job4:
    needs: [ job1, job2, job3 ]
    name: Job4
    runs-on: ubuntu-latest
    steps:
      - name: Job for multiple dependencies
        run: sleep 10
